name: Build SaraAssistant

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos: sólo lectura salvo en el job que publica el release.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de ejecución
        run: chmod +x gradlew

      - name: Descargar dependencias
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /dev/null

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon test

      - name: Compilar APK debug
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        id: apk
        run: |
          NAME="SaraAssistant-v1.0.${{ github.run_number }}-debug.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SaraAssistant-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  release:
    name: Actualizar release
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: SaraAssistant-debug-apk

      - name: Crear release SaraAssistantV${{ github.run_number }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: SaraAssistantV${{ github.run_number }}
          name: SaraAssistantV${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: SaraAssistant-*.apk
          body: |
            APK debug generado automáticamente desde ${{ github.sha }}.
            Instalación: descargá el APK, abrilo en el teléfono y permití «instalar apps desconocidas».
