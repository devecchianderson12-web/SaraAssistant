name: Build SaraAssistant

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Permisos mínimos: sólo lectura salvo en el job que publica el release.
permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Pruebas y APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Validar Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Permisos de ejecución
        run: chmod +x gradlew

      - name: Descargar dependencias
        run: ./gradlew --no-daemon :app:dependencies --configuration debugRuntimeClasspath > /dev/null

      - name: Pruebas unitarias
        run: ./gradlew --no-daemon test

      - name: Compilar APK debug
        env:
          SARA_AZURE_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          SARA_AZURE_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SARA_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew --no-daemon assembleDebug

      - name: Renombrar APK
        id: apk
        run: |
          NAME="SaraAssistant-v$(tr -d '[:space:]' < app/VERSION).apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$NAME"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Publicar APK como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: SaraAssistant-debug-apk
          path: ${{ steps.apk.outputs.name }}
          if-no-files-found: error

      - name: Publicar reportes de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-de-pruebas
          path: |
            core/build/reports/tests/
            app/build/reports/tests/
          if-no-files-found: ignore

  arranque:
    name: Arranque en emulador
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Descargar APK
        uses: actions/download-artifact@v4
        with:
          name: SaraAssistant-debug-apk
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # No se publica una versión que se cierre al abrir: se instala, se abre, se recorren las
      # pestañas y se prueban órdenes; si hay un cierre, el release no se crea.
      - name: Abrir la app y probar órdenes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            for i in $(seq 1 30); do adb shell pm path android >/dev/null 2>&1 && break; sleep 2; done
            for i in 1 2 3; do adb install -r SaraAssistant-*.apk && break; sleep 5; done
            adb logcat -c
            adb shell am start -W -n com.sara.assistant/.ui.MainActivity
            sleep 12
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'qué hora es'" || true
            sleep 5
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'agregá pan a la lista de compras'" || true
            sleep 5
            # Saber general sin IA (Wikipedia) y notificaciones.
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'qué es la fotosíntesis'" || true
            sleep 8
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'leeme las notificaciones'" || true
            sleep 5
            adb logcat -d | grep -iE "fotos|Wikipedia|notificaci" | tail -8 || true
            adb shell input tap 160 601 || true
            sleep 3
            # Pestaña Ajustes (abajo a la derecha) y recorrido. Cada línea corre aparte: coordenadas fijas
            # de esta pantalla de emulador (320x640).
            adb shell input tap 272 601 || true
            sleep 3
            adb exec-out screencap -p > ajustes1.png || true
            adb shell input swipe 160 480 160 130 400 || true
            sleep 2
            adb exec-out screencap -p > ajustes2.png || true
            adb shell input swipe 160 480 160 130 400 || true
            sleep 3
            adb exec-out screencap -p > ajustes3.png || true
            for n in 4 5 6; do adb shell input swipe 160 480 160 130 400; sleep 2; adb exec-out screencap -p > ajustes$n.png; done || true
            # Voz Daniela (Piper): se baja, se instala y habla; se informa cuánto tarda en empezar a sonar.
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --ez piper true || true
            for i in $(seq 1 100); do adb logcat -d | grep -q "Voz Daniela instalada\|No pude bajar la voz Daniela" && break; sleep 3; done; adb logcat -d | grep "Sara/Piper" | tail -5 || true
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es say "'Hola, soy Sara. ¿En qué te ayudo?'" || true
            for i in $(seq 1 40); do adb logcat -d | grep -q "Sara/Debug" && break; sleep 3; done; adb logcat -d | grep -E "Sara/Piper|Sara/Debug" | tail -8 || true
            # Preguntas con la voz Daniela: la hora y qué está sonando (antes la hora la cerraba).
            adb logcat -c || true
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'Ey Sara, ¿qué hora es?'" || true
            sleep 15
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "'¿qué está sonando?'" || true
            sleep 12
            adb logcat -d | grep -E "Sara/|AndroidRuntime|Fatal signal|has died|ANR in" | grep -v "Sara/Wake" | tail -40 || true
            adb shell pidof com.sara.assistant || echo "SARA SE CERRÓ"
            # Llamado («Sara»): cuánto tarda en saludar y abrir el micrófono (dos veces: la segunda con todo cargado).
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --ez wake true || true
            sleep 12
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --ez wake true || true
            sleep 12
            adb logcat -d | grep -E "Abro el micrófono|Listo para escuchar|Sara/Piper: .*habló" | tail -8 || true
            # Esfera sobre otra pantalla: se va al inicio y se llama a Sara.
            adb shell appops set com.sara.assistant SYSTEM_ALERT_WINDOW allow || true
            adb shell input keyevent KEYCODE_HOME
            sleep 2
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --ez listen true || true
            sleep 1.5
            adb exec-out screencap -p > esfera.png || true
            adb logcat -d | grep -iE "SphereActivity|Background activity|BAL_|Abort background" | tail -15 || true
            sleep 6
            adb logcat -d > logcat.txt
            grep -E "Fatal signal|Abort message|JNI DETECTED|lowmemorykiller|com.sara.assistant.*has died|F .sara.assistant|F DEBUG" logcat.txt | grep -v "native: #\|  at \|^.*runtime.cc:[0-9]*\]   " | head -40 || true
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A30 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            adb shell pidof com.sara.assistant
      # En ejecuciones manuales, la captura de la esfera se guarda en la rama «capturas» para revisarla.
      - name: Publicar captura (manual)
        if: github.event_name == 'workflow_dispatch' && hashFiles('esfera.png') != ''
        run: |
          mkdir capturas && cp esfera.png capturas/ && cp ajustes*.png capturas/ 2>/dev/null; cd capturas
          git init -q && git checkout -q -b capturas
          git -c user.name=ci -c user.email=ci@example.invalid add .
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "Captura de la esfera ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas
      - name: Guardar logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat-arranque
          path: |
            logcat.txt
            esfera.png
            ajustes*.png
          if-no-files-found: ignore

  windows:
    name: Lucy para Windows (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    timeout-minutes: 40
    env:
      LUCY_ONLY: "1"
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      # El mismo cerebro que Android (módulo core) + la parte de Windows (módulo desktop).
      - name: Pruebas y compilación de Lucy
        run: ./gradlew --no-daemon :core:test :desktop:test :desktop:installDist -PlucyVersion=${{ github.run_number }}

      # El modelo de voz en español va adentro (funciona sin Internet desde el primer uso).
      - name: Preparar la app (modelo de voz, ícono, sólo lo de Windows)
        shell: pwsh
        run: |
          $lib = "desktop/build/install/Lucy/lib"
          # Las librerías nativas de Vosk para Linux y Mac no hacen falta.
          $vosk = Get-ChildItem $lib -Filter "vosk-*.jar" | Select-Object -First 1
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::Open($vosk.FullName, 'Update')
          @($zip.Entries | Where-Object { $_.FullName -like 'linux-*' -or $_.FullName -like 'darwin*' }) | ForEach-Object { $_.Delete() }
          $zip.Dispose()
          Invoke-WebRequest https://alphacephei.com/vosk/models/vosk-model-small-es-0.42.zip -OutFile model.zip
          Expand-Archive model.zip -DestinationPath model-tmp
          New-Item -ItemType Directory -Force content | Out-Null
          Move-Item model-tmp/vosk-model-small-es-0.42 content/model
          # Voces de Piper: DLL de sherpa-onnx (la misma versión que Android).
          Invoke-WebRequest https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-win-x64-jni.tar.bz2 -OutFile sherpa.tar.bz2
          tar -xjf sherpa.tar.bz2
          New-Item -ItemType Directory -Force content/sherpa | Out-Null
          Copy-Item sherpa-onnx-v1.13.8-win-x64-jni/lib/*.dll content/sherpa/
          java -cp "$lib/*" com.sara.lucy.MainKt --write-icon windows/Launcher/lucy.ico
          if (-not (Test-Path windows/Launcher/lucy.ico)) { throw "sin ícono" }

      # «Lucy» con audio real y el modelo de voz: se activa al llamarla y no con charla ni canciones.
      - name: Prueba de la palabra «Lucy» con el modelo real
        shell: pwsh
        run: ./gradlew --no-daemon :desktop:test --tests "com.sara.lucy.WakeWordAudioTest" "-PlucyModel=$PWD/content/model" -PlucyVersion=${{ github.run_number }}

      - name: Empaquetar (Java propio, sin instalar nada)
        shell: pwsh
        run: |
          $jar = (Get-ChildItem desktop/build/install/Lucy/lib -Filter "desktop*.jar" | Select-Object -First 1).Name
          jpackage --type app-image --name Lucy --app-version "1.0.${{ github.run_number }}" --vendor Lucy `
            --input desktop/build/install/Lucy/lib --main-jar $jar --main-class com.sara.lucy.MainKt `
            --icon windows/Launcher/lucy.ico --app-content content/model --app-content content/sherpa --dest image `
            --java-options "-Xmx512m -XX:+UseSerialGC -Dfile.encoding=UTF-8 -Dstdout.encoding=UTF-8 -Djna.encoding=UTF-8" `
            --add-modules "java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.scripting,java.sql,java.xml,jdk.crypto.ec,jdk.crypto.cryptoki,jdk.unsupported,jdk.localedata,jdk.charsets,jdk.zipfs,jdk.accessibility" `
            --jlink-options "--strip-debug --no-man-pages --no-header-files --compress=zip-6"
          Get-ChildItem image/Lucy | Format-Table Name, Length
          Compress-Archive -Path image/Lucy/* -DestinationPath windows/Launcher/app.zip -CompressionLevel Optimal
          "app.zip: {0:N0} MB" -f ((Get-Item windows/Launcher/app.zip).Length / 1MB)

      - name: Compilar el .exe portable (con ícono)
        run: dotnet build windows/Launcher/Launcher.csproj -c Release -o launcher -p:Version=1.0.${{ github.run_number }}

      - name: Renombrar
        shell: pwsh
        run: |
          Copy-Item launcher/Lucy.exe "Lucy-Windows-v1.0.${{ github.run_number }}.exe"
          "Lucy.exe: {0:N0} MB" -f ((Get-Item "Lucy-Windows-v1.0.${{ github.run_number }}.exe").Length / 1MB)

      # No se publica un .exe que no arranque: se abre el .exe final (se descomprime como en tu PC)
      # y se prueban el cerebro, Windows, la voz, las respuestas y la ventana con la esfera.
      - name: Autoprueba del .exe final
        shell: pwsh
        run: |
          $dir = "$PWD/autoprueba"
          $p = Start-Process -FilePath "Lucy-Windows-v1.0.${{ github.run_number }}.exe" -ArgumentList "--selftest", "`"$dir`"" -Wait -PassThru
          Get-Content "$dir/selftest.txt" -Encoding UTF8
          if ($p.ExitCode -ne 0) { Get-Content "$env:APPDATA/Lucy/lucy.log" -Tail 60 -ErrorAction SilentlyContinue; exit 1 }

      - name: Guardar autoprueba (captura y resultados)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lucy-autoprueba
          path: autoprueba/
          if-no-files-found: ignore

      # En ejecuciones manuales, la captura de Lucy se guarda en la rama «capturas-lucy» para revisarla.
      - name: Publicar captura (manual)
        if: github.event_name == 'workflow_dispatch' && hashFiles('autoprueba/lucy.png') != ''
        shell: bash
        run: |
          mkdir capturas && cp autoprueba/lucy.png autoprueba/selftest.txt capturas/ && cp autoprueba/ajustes.png capturas/ 2>/dev/null; cd capturas
          git init -q && git checkout -q -b capturas-lucy
          git -c user.name=ci -c user.email=ci@example.invalid add .
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "Captura de Lucy ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-lucy

      - name: Publicar .exe como artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Lucy-Windows-exe
          path: Lucy-Windows-*.exe
          if-no-files-found: error

  release:
    name: Publicar actualizaciones
    needs: [build, arranque, windows]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Cada plataforma se actualiza sólo si cambió lo suyo: app/ → Android, desktop/ → Windows,
      # core/ (el cerebro compartido) → las dos. «[windows]» o «[android]» en el mensaje lo fuerzan.
      - name: Qué plataformas cambiaron
        id: cambios
        env:
          BEFORE: ${{ github.event.before }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            FILES=$(git show --name-only --format= HEAD)
          else
            FILES=$(git diff --name-only "$BEFORE" HEAD)
          fi
          echo "$FILES"
          ANDROID=false; WINDOWS=false
          echo "$FILES" | grep -qE '^(app/|core/)' && ANDROID=true
          echo "$FILES" | grep -qE '^(desktop/|core/|windows/)' && WINDOWS=true
          case "$MSG" in *"[windows]"*) ANDROID=false; WINDOWS=true ;; esac
          case "$MSG" in *"[android]"*) ANDROID=true; WINDOWS=false ;; esac
          echo "android=$ANDROID" >> "$GITHUB_OUTPUT"
          echo "windows=$WINDOWS" >> "$GITHUB_OUTPUT"
          echo "Android: $ANDROID · Windows: $WINDOWS"

      - name: Descargar APK
        if: steps.cambios.outputs.android == 'true'
        uses: actions/download-artifact@v4
        with:
          name: SaraAssistant-debug-apk

      - name: Descargar Lucy para Windows
        if: steps.cambios.outputs.windows == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Lucy-Windows-exe

      # Un solo release «SaraAssistant» con las dos apps (la versión va en el nombre de cada archivo).
      # Se reemplaza sólo el archivo de la plataforma que cambió. El tag (SaraAssistantV<n>) sólo
      # cambia con una versión nueva de Android: es lo que mira el teléfono para actualizarse.
      - name: Actualizar el release SaraAssistant
        if: steps.cambios.outputs.android == 'true' || steps.cambios.outputs.windows == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ANDROID: ${{ steps.cambios.outputs.android }}
          WINDOWS: ${{ steps.cambios.outputs.windows }}
          RUN: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        run: |
          set -e
          TAG=$(gh api "repos/$REPO/releases/latest" -q .tag_name 2>/dev/null || true)
          if [ -z "$TAG" ]; then
            TAG="SaraAssistantV$RUN"
            gh release create "$TAG" -R "$REPO" --target "$SHA" --title "SaraAssistant" --notes "SaraAssistant" --latest
          fi
          echo "Release actual: $TAG"
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" -q '.assets[].name')
          if [ "$WINDOWS" = "true" ]; then
            for a in $(echo "$ASSETS" | grep -E '^Lucy-Windows.*\.exe$' || true); do gh release delete-asset "$TAG" "$a" -R "$REPO" -y; done
            gh release upload "$TAG" Lucy-Windows-*.exe -R "$REPO" --clobber
          fi
          if [ "$ANDROID" = "true" ]; then
            for a in $(echo "$ASSETS" | grep -E '^SaraAssistant-.*\.apk$' || true); do gh release delete-asset "$TAG" "$a" -R "$REPO" -y; done
            gh release upload "$TAG" SaraAssistant-*.apk -R "$REPO" --clobber
            NEW="SaraAssistantV$RUN"
            gh release edit "$TAG" -R "$REPO" --tag "$NEW" --target "$SHA" --latest
            TAG="$NEW"
          fi
          FILES=$(gh api "repos/$REPO/releases/tags/$TAG" -q '[.assets[].name] | join("\n- ")')
          printf 'Sara para Android y Lucy para Windows.\n\n- %s\n\nAndroid: descargá el APK y abrilo en el teléfono (permití «instalar apps desconocidas»).\nWindows: descargá el .exe y abrilo (no necesita instalación).\n' "$FILES" > notas.md
          gh release edit "$TAG" -R "$REPO" --title "SaraAssistant" --notes-file notas.md
          # Releases separadas de Lucy de antes: ya no hacen falta.
          for old in $(gh api "repos/$REPO/releases?per_page=100" -q '.[] | select(.tag_name | startswith("LucyV")) | .tag_name'); do
            gh release delete "$old" -R "$REPO" -y --cleanup-tag || true
          done
