name: Prueba de arranque en emulador

# Se ejecuta a mano: instala el APK en un emulador, abre la app y guarda el logcat (para
# detectar cierres al iniciar antes de publicar).
on:
  workflow_dispatch:
  push:
    branches: [debug-crash]

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compilar APK
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Abrir la app en el emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb logcat -c
            adb shell am start -W -n com.sara.assistant/.ui.MainActivity
            sleep 15
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "qué hora es" || true
            sleep 8
            adb shell am broadcast -a com.sara.assistant.DEBUG_COMMAND -p com.sara.assistant --es text "prendé la linterna" || true
            sleep 8
            adb logcat -d > logcat.txt
            adb shell pidof com.sara.assistant || echo "LA APP NO ESTA CORRIENDO"
            grep -E "FATAL EXCEPTION|AndroidRuntime" -A40 logcat.txt | head -120 || true
      - name: Guardar logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logcat
          path: logcat.txt
          if-no-files-found: ignore
