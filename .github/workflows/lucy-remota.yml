name: Lucy Remota

# Proyecto independiente: sólo se compila cuando cambia lucy-remota/ (no toca a Sara ni a la Lucy actual).
on:
  push:
    branches: [main]
    paths: ["lucy-remota/**", ".github/workflows/lucy-remota.yml"]
  pull_request:
    paths: ["lucy-remota/**", ".github/workflows/lucy-remota.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: lucy-remota-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receptor:
    name: Receptor para Windows (.exe)
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    defaults:
      run:
        working-directory: lucy-remota/windows
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configurar Node (relé local para las pruebas)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Pruebas del núcleo (protocolo, seguridad, vinculación y relé)
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          # El relé de verdad (el mismo código que corre en Cloudflare), en esta máquina.
          (cd ../relay && npm ci --no-audit --no-fund && (npx wrangler dev --port 8787 > ../wrangler.log 2>&1 &))
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ && break; sleep 2; done
          (cd ../relay && node test/relay.test.mjs)
          LUCY_RELAY_URL=http://127.0.0.1:8787 dotnet test tests/LucyRemota.Tests -c Release

      - name: Compilar Lucy Remota (un solo .exe portable)
        shell: bash
        run: dotnet publish src/LucyRemota -c Release -o publicado -p:Version=$(tr -d '[:space:]' < VERSION)

      - name: Nombre del archivo
        shell: pwsh
        run: |
          $name = "LucyRemota-v$((Get-Content VERSION -Raw).Trim()).exe"
          Copy-Item publicado/LucyRemota.exe $name
          "{0}: {1:N1} MB" -f $name, ((Get-Item $name).Length / 1MB)

      - name: Autoprueba en Windows (teléfono simulado, órdenes reales)
        shell: pwsh
        run: |
          $dir = Join-Path $PWD "autoprueba"
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = Start-Process -FilePath "LucyRemota-v$((Get-Content VERSION -Raw).Trim()).exe" -ArgumentList "--autoprueba", "`"$dir`"" -Wait -PassThru
          "Arranque + autoprueba: $($sw.ElapsedMilliseconds) ms"
          Get-Content (Join-Path $dir "autoprueba.txt")
          if ($p.ExitCode -ne 0) { throw "La autoprueba falló ($($p.ExitCode))" }

      - name: Guardar autoprueba
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoprueba-receptor
          path: lucy-remota/windows/autoprueba/
          if-no-files-found: ignore

      - name: Publicar captura (manual)
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          mkdir capturas && cp autoprueba/*.png autoprueba/autoprueba.txt capturas/ 2>/dev/null; cd capturas
          git init -q && git checkout -q -b capturas-lucy-remota
          git -c user.name=ci -c user.email=ci@example.invalid add .
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "Capturas de Lucy Remota ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-lucy-remota

      - name: Guardar el .exe
        uses: actions/upload-artifact@v4
        with:
          name: LucyRemota-Receptor
          path: lucy-remota/windows/LucyRemota-*.exe
          if-no-files-found: error

  emisor:
    name: Emisor para Android (APK) y pruebas del protocolo
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: lucy-remota/android
    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar .NET 8 (PC simulada para probar el teléfono contra Windows)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Configurar Gradle (con caché)
        uses: gradle/actions/setup-gradle@v4

      - name: Configurar Node (relé local para las pruebas)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Relé local (el mismo código que corre en Cloudflare)
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          cd ../relay && npm ci --no-audit --no-fund
          (npx wrangler dev --port 8787 > ../wrangler.log 2>&1 &)
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:8787/ && break; sleep 2; done
          node test/relay.test.mjs

      - name: Pruebas del teléfono contra el Receptor real (.NET)
        run: |
          chmod +x gradlew
          dotnet build ../windows/tools/PcSim -c Release -o pcsim -v q
          rm -f qr.txt qr2.txt
          # Se vinculan en la «misma red» y después se encuentran en el relé («redes distintas»).
          (dotnet pcsim/PcSim.dll qr.txt 240 --relay http://127.0.0.1:8787 > pcsim.log 2>&1 &)
          LUCY_RELAY_URL=http://127.0.0.1:8787 LUCY_INTEROP_QR=$PWD/qr.txt ./gradlew --no-daemon :protocolo:test
          # Cada prueba completa usa su propia PC simulada (el QR es de un solo uso).
          (dotnet pcsim/PcSim.dll qr2.txt 240 > pcsim2.log 2>&1 &)
          LUCY_INTEROP_QR=$PWD/qr2.txt ./gradlew --no-daemon :remoto:test
          echo "--- PC simulada"; cat pcsim.log pcsim2.log

      - name: Compilar APK
        env:
          SARA_AZURE_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          SARA_AZURE_REGION: ${{ secrets.AZURE_SPEECH_REGION }}
          SARA_GEMINI_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: ./gradlew --no-daemon :app:assembleDebug

      - name: Nombre del archivo
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "LucyRemota-v$(tr -d '[:space:]' < VERSION).apk"
          ls -la LucyRemota-*.apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: LucyRemota-Emisor
          path: lucy-remota/android/LucyRemota-*.apk
          if-no-files-found: error

  emisor-emulador:
    name: Emisor en emulador contra la PC simulada
    needs: emisor
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Descargar el APK
        uses: actions/download-artifact@v4
        with:
          name: LucyRemota-Emisor
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: PC simulada
        run: dotnet build lucy-remota/windows/tools/PcSim -c Release -o pcsim -v q
      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # La app real en Android: se vincula con la PC simulada (por adb, con el QR) y manda órdenes de voz
      # escritas. Si se cierra o no conecta, no se publica.
      - name: Abrir la app, vincular y mandar órdenes
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            adb wait-for-device
            for i in $(seq 1 30); do adb shell pm path android >/dev/null 2>&1 && break; sleep 2; done
            for i in 1 2 3; do adb install -r LucyRemota-*.apk && break; sleep 5; done
            adb logcat -c
            # Primera vez, como en un teléfono nuevo: sin permisos todavía (antes se cerraba acá).
            adb shell am start -W -n com.lucyremota.emisor/.ui.MainActivity
            sleep 8
            adb exec-out screencap -p > emisor0.png || true
            adb logcat -d > logcat0.txt
            if grep -q "FATAL EXCEPTION" logcat0.txt; then grep -A30 "FATAL EXCEPTION" logcat0.txt | head -60; exit 1; fi
            adb shell pidof com.lucyremota.emisor || (echo "La app se cerró al abrirla sin permisos"; exit 1)
            adb shell pm grant com.lucyremota.emisor android.permission.RECORD_AUDIO || true
            adb shell pm grant com.lucyremota.emisor android.permission.POST_NOTIFICATIONS || true
            adb shell am force-stop com.lucyremota.emisor
            adb logcat -c
            adb shell am start -W -n com.lucyremota.emisor/.ui.MainActivity
            sleep 8
            adb exec-out screencap -p > emisor1.png || true
            adb forward tcp:47800 tcp:47800
            nohup dotnet pcsim/PcSim.dll qr.txt 200 --direct 127.0.0.1:47800 > pcsim.log 2>&1 &
            for i in $(seq 1 30); do [ -f qr.txt ] && break; sleep 1; done
            adb shell am broadcast -a com.lucyremota.emisor.DEBUG -p com.lucyremota.emisor --es qr "'$(cat qr.txt)'"
            for i in $(seq 1 30); do grep -q "Conectada" pcsim.log && break; sleep 2; done; cat pcsim.log
            grep -q "Conectada" pcsim.log
            adb exec-out screencap -p > emisor2.png || true
            adb shell am broadcast -a com.lucyremota.emisor.DEBUG -p com.lucyremota.emisor --es text "'poné el volumen al 30'"
            sleep 10
            adb shell am broadcast -a com.lucyremota.emisor.DEBUG -p com.lucyremota.emisor --es text "'subí el volumen'"
            sleep 10
            adb exec-out screencap -p > emisor3.png || true
            adb logcat -d | grep -E "LucyRemota/|AndroidRuntime|FATAL" | tail -40 || true
            adb logcat -d > logcat.txt
            if grep -q "FATAL EXCEPTION" logcat.txt; then grep -A30 "FATAL EXCEPTION" logcat.txt | head -60; exit 1; fi
            cat pcsim.log
            grep -q "Volumen al 40" pcsim.log || (echo "La PC no recibió las órdenes"; exit 1)
            adb logcat -d | grep -q "Okey" || (echo "Lucy no contestó"; exit 1)
      - name: Publicar capturas (manual)
        if: always() && github.event_name == 'workflow_dispatch'
        run: |
          mkdir capturas && cp emisor*.png pcsim.log capturas/ 2>/dev/null; cd capturas
          git init -q && git checkout -q -b capturas-lucy-remota-android
          git -c user.name=ci -c user.email=ci@example.invalid add .
          git -c user.name=ci -c user.email=ci@example.invalid commit -qm "Capturas del Emisor ${{ github.sha }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" capturas-lucy-remota-android

  publicar:
    name: Publicar en el release SaraAssistant
    needs: [receptor, emisor, emisor-emulador]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: release-saraassistant
    permissions:
      contents: write
    steps:
      - name: Descargar código (para leer las versiones)
        uses: actions/checkout@v4
      # Cada plataforma se actualiza por separado: sólo se publica la que cambió en este envío.
      # Cada plataforma se publica cuando sube su número (VERSION): si el release ya tiene esa versión,
      # no se toca (así actualizar el teléfono no obliga a actualizar la PC, y al revés).
      - name: Qué hay que publicar
        id: cambios
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          TAG=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          ASSETS=$(gh api "repos/$REPO/releases/tags/$TAG" -q '.assets[].name')
          WV=$(tr -d '[:space:]' < lucy-remota/windows/VERSION); AV=$(tr -d '[:space:]' < lucy-remota/android/VERSION)
          W=true; A=true
          echo "$ASSETS" | grep -qx "LucyRemota-v$WV.exe" && W=false
          echo "$ASSETS" | grep -qx "LucyRemota-v$AV.apk" && A=false
          echo "windows=$W" >> "$GITHUB_OUTPUT"; echo "android=$A" >> "$GITHUB_OUTPUT"
          echo "Windows $WV: $W · Android $AV: $A"
      - name: Descargar el .exe
        uses: actions/download-artifact@v4
        with:
          name: LucyRemota-Receptor
      - name: Descargar el APK
        uses: actions/download-artifact@v4
        with:
          name: LucyRemota-Emisor
      # Mismo release que Sara y Lucy: se reemplazan sólo los archivos de Lucy Remota (el tag no cambia,
      # así el teléfono con Sara no cree que hay una versión nueva de Sara).
      - name: Subir Lucy Remota al release
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -e
          TAG=$(gh api "repos/$REPO/releases/latest" -q .tag_name)
          echo "Release: $TAG"
          UP=""
          if [ "${{ steps.cambios.outputs.windows }}" = true ]; then UP="$UP $(ls LucyRemota-*.exe)"; PAT='exe'; fi
          if [ "${{ steps.cambios.outputs.android }}" = true ]; then UP="$UP $(ls LucyRemota-*.apk)"; PAT="${PAT:+$PAT|}apk"; fi
          if [ -z "$UP" ]; then echo "Nada para publicar"; exit 0; fi
          for a in $(gh api "repos/$REPO/releases/tags/$TAG" -q '.assets[].name' | grep -E "^LucyRemota-.*\.($PAT)$" || true); do gh release delete-asset "$TAG" "$a" -R "$REPO" -y; done
          gh release upload "$TAG" $UP -R "$REPO" --clobber
          FILES=$(gh api "repos/$REPO/releases/tags/$TAG" -q '[.assets[].name] | join("\n- ")')
          printf 'Sara (Android) y Lucy Remota (teléfono + PC).\n\n- %s\n\nSara: SaraAssistant-…apk.\nLucy Remota: LucyRemota-…apk en el teléfono y LucyRemota-…exe en la PC.\nLucyRemota-Local-…zip: «Lucy en esta PC» (lo baja solo Lucy Remota al activarla; no hace falta descargarlo).\n' "$FILES" > notas.md
          gh release edit "$TAG" -R "$REPO" --title "SaraAssistant" --notes-file notas.md
